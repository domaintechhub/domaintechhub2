<!DOCTYPE html>

    <style>
      body {

        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

        display: flex;

        font-family: monospace;
        font-size: 12px;

        letter-spacing: 0.08em;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 32px;
        margin: 0 0 12px;
      }
      p {
        color: #94a3b8;
        line-height: 1.6;
        margin: 0 0 28px;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      .links a {
        text-decoration: none;
        padding: 10px 18px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        background: #1e293b;
        color: #e2e8f0;
        border: 1px solid #334155;
