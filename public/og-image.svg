<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#041f1e" />
    </linearGradient>
    <linearGradient id="glow-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#065f46" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.2" />
    </linearGradient>
    <path id="og-leaf" d="M 0,-70 C 30,-38 33,14 0,54 C -33,14 -30,-38 0,-70 Z" />
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="150" r="320" fill="url(#glow-teal)" filter="blur(80px)" />
  <circle cx="1050" cy="500" r="280" fill="#0284c7" fill-opacity="0.15" filter="blur(90px)" />

  <!-- Grid overlay lines -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="1120" y1="0" x2="1120" y2="630" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Card Container Frame -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="#0f172a" fill-opacity="0.6" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Sprout 3 Leaves Brand Mark -->
  <g transform="translate(170, 230)">
    <use href="#og-leaf" x="0" y="-14" transform="scale(0.95)" fill="#A6EE35" />
    <use href="#og-leaf" transform="translate(-48, -2) rotate(-46) scale(0.9)" fill="#A6EE35" />
    <use href="#og-leaf" transform="translate(48, -2) rotate(46) scale(0.9)" fill="#A6EE35" />
  </g>

  <!-- Studio Name -->
  <text x="270" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="0.04em">
    DOMAIN TECH HUB
  </text>

  <!-- Studio Subtitle / Tagline -->
  <text x="272" y="255" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700" fill="#2dd4bf" letter-spacing="0.22em">
    INNOVATE. CONNECT. SUCCEED. · INDEPENDENT ENGINEERING STUDIO · NAIROBI
  </text>

  <!-- Big Value Proposition Headline -->
  <text x="140" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="-0.02em">
    Engineering High-Converting Websites & Bespoke Digital Systems
  </text>

  <!-- Description paragraph -->
  <text x="140" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    Fast React & Next.js architectures, Safaricom Daraja 3.0 M-Pesa STK Push, headless commerce,
  </text>
  <text x="140" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    custom software automation, and data-driven SEO built for sustainable business revenue.
  </text>

  <!-- Badges footer in card -->
  <g transform="translate(140, 465)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="90" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">WEB &amp; MOBILE</text>

    <!-- Badge 2 -->
    <rect x="195" y="0" width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="285" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">M-PESA DARAJA</text>

    <!-- Badge 3 -->
    <rect x="390" y="0" width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="480" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle">GOOGLE SEO #1</text>

    <!-- Badge 4 -->
    <rect x="585" y="0" width="220" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="695" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#a78bfa" text-anchor="middle">NAIROBI STUDIO</text>
  </g>
</svg>
