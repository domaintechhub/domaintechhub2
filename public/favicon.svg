<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Smooth natural leaf silhouette -->
    <path id="leaf-shape" d="M 0,-44 C 18,-24 20,8 0,32 C -20,8 -18,-24 0,-44 Z" />
  </defs>
  <!-- Center Leaf -->
  <g transform="translate(60, 50)">
    <use href="#leaf-shape" x="0" y="-8" transform="scale(0.85)" fill="#A6EE35" />
  </g>
  <!-- Left Leaf -->
  <g transform="translate(60, 68)">
    <use href="#leaf-shape" transform="translate(-28, -2) rotate(-46) scale(0.8)" fill="#A6EE35" />
  </g>
  <!-- Right Leaf -->
  <g transform="translate(60, 68)">
    <use href="#leaf-shape" transform="translate(28, -2) rotate(46) scale(0.8)" fill="#A6EE35" />
  </g>
</svg>