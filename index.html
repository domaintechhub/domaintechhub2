    <!-- Instant Zero-Delay Preloader Styles (Renders before JS loads) -->
    <style>
      #dth-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #020617;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        z-index: 99999;
        text-align: center;
        padding: 20px;
      }
      .dth-preloader-glow {
        position: absolute;
        width: 220px;
        height: 220px;
        background: radial-gradient(circle, rgba(166, 238, 53, 0.22) 0%, rgba(13, 148, 136, 0.12) 50%, transparent 70%);
        border-radius: 50%;
        filter: blur(32px);
        animation: dth-pulse-glow 2.4s ease-in-out infinite alternate;
        pointer-events: none;
      }
      .dth-preloader-emblem {
        position: relative;
        width: 88px;
        height: 88px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(51, 65, 85, 0.6);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.6), 0 0 24px -2px rgba(166, 238, 53, 0.25);
        margin-bottom: 16px;
      }
      .dth-preloader-leaf-center {
        transform-origin: 60px 68px;
        animation: dth-leaf-bloom 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite alternate;
      }
      .dth-preloader-leaf-left {
        transform-origin: 60px 68px;
        animation: dth-leaf-bloom-left 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.12s infinite alternate;
      }
      .dth-preloader-leaf-right {
        transform-origin: 60px 68px;
        animation: dth-leaf-bloom-right 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.24s infinite alternate;
      }
      @keyframes dth-pulse-glow {
        0% { transform: scale(0.9); opacity: 0.45; }
        100% { transform: scale(1.2); opacity: 0.95; }
      }
      @keyframes dth-leaf-bloom {
        0% { transform: scale(0.85) translateY(4px); }
        100% { transform: scale(1.06) translateY(-2px); }
      }
      @keyframes dth-leaf-bloom-left {
        0% { transform: rotate(-48deg) scale(0.75); }
        100% { transform: rotate(-43deg) scale(0.96); }
      }
      @keyframes dth-leaf-bloom-right {
        0% { transform: rotate(48deg) scale(0.75); }
        100% { transform: rotate(43deg) scale(0.96); }
      }
      .dth-preloader-title {
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.04em;
        margin-bottom: 4px;
        color: #ffffff;
      }
      .dth-preloader-title span.teal { color: #2dd4bf; }
      .dth-preloader-title span.lime { color: #a3e635; }
      .dth-preloader-sub {
        font-size: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #94a3b8;
        margin-bottom: 16px;
      }
      .dth-preloader-track {
        width: 190px;
        height: 3px;
        background: rgba(30, 41, 59, 0.9);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
      }
      .dth-preloader-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        background: linear-gradient(90deg, #a3e635, #2dd4bf, #38bdf8);
        border-radius: 9999px;
        animation: dth-html-progress 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes dth-html-progress {
        0% { left: -40%; width: 35%; }
        50% { left: 25%; width: 55%; }
        100% { left: 105%; width: 35%; }
      }
