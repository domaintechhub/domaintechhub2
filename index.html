        100% { transform: scale(1.18); opacity: 0.9; }
      }
      .dth-leaf-group-center {
        transform-origin: 60px 68px;
        animation: dth-bloom-center 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite alternate;
      }
      .dth-leaf-group-left {
        transform-origin: 60px 68px;
        animation: dth-bloom-left 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.14s infinite alternate;
      }
      .dth-leaf-group-right {
        transform-origin: 60px 68px;
        animation: dth-bloom-right 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.28s infinite alternate;
      }
      @keyframes dth-bloom-center {
        0% { transform: scale(0.8) translateY(6px); opacity: 0.7; }
        100% { transform: scale(1.05) translateY(-2px); opacity: 1; }
      }
      @keyframes dth-bloom-left {
        0% { transform: rotate(-6deg) scale(0.8); opacity: 0.7; }
        100% { transform: rotate(3deg) scale(1.04); opacity: 1; }
      }
      @keyframes dth-bloom-right {
        0% { transform: rotate(6deg) scale(0.8); opacity: 0.7; }
        100% { transform: rotate(-3deg) scale(1.04); opacity: 1; }
      }
      .dth-preloader-title {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.06em;
        margin-bottom: 6px;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .dth-preloader-title span.teal { color: #0d9488; }
      .dth-preloader-title span.lime { color: #84cc16; }
      .dth-preloader-sub {
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #64748b;
        margin-bottom: 20px;
      }
      .dth-preloader-track {
        width: 210px;
        height: 3px;
        background: rgba(226, 232, 240, 0.9);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.06);
      }
      .dth-preloader-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        background: linear-gradient(90deg, #a3e635, #2dd4bf, #38bdf8);
        border-radius: 9999px;
        animation: dth-html-progress 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes dth-html-progress {
        0% { left: -40%; width: 35%; }
        50% { left: 25%; width: 55%; }
        100% { left: 105%; width: 35%; }
      }
    </style>
  </head>
  <body class="bg-[#faf8f5] text-slate-900 font-sans antialiased selection:bg-teal-500/20 selection:text-teal-800 min-h-screen">
    <!-- Instant Zero-Delay Preloader (Renders immediately before JS bundle loads) -->
    <div id="dth-preloader" aria-live="polite" aria-label="Loading Domain Tech Hub website">
      <div class="dth-preloader-glow"></div>
      <div class="dth-preloader-emblem">
        <div class="dth-preloader-emblem-ring"></div>
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%; position: relative; z-index: 1;">
          <defs>
            <path id="preloader-leaf" d="M 0,-44 C 18,-24 20,8 0,32 C -20,8 -18,-24 0,-44 Z" />
            <linearGradient id="preloader-lime" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#95e424" />
              <stop offset="60%" stop-color="#a6ee35" />
              <stop offset="100%" stop-color="#bcf35e" />
            </linearGradient>
          </defs>
          <!-- Center Leaf: Outer group handles scale/translate animation; inner group sets coordinate transform -->
          <g class="dth-leaf-group-center">
            <g transform="translate(60, 50)">
              <use href="#preloader-leaf" x="0" y="-8" transform="scale(0.85)" fill="url(#preloader-lime)" />
            </g>
          </g>
          <!-- Left Leaf: Outer group handles rotation bloom; inner group sets coordinate transform -->
          <g class="dth-leaf-group-left">
            <g transform="translate(60, 68)">
              <use href="#preloader-leaf" transform="translate(-28, -2) rotate(-46) scale(0.8)" fill="url(#preloader-lime)" />
            </g>
          </g>
          <!-- Right Leaf: Outer group handles rotation bloom; inner group sets coordinate transform -->
          <g class="dth-leaf-group-right">
            <g transform="translate(60, 68)">
              <use href="#preloader-leaf" transform="translate(28, -2) rotate(46) scale(0.8)" fill="url(#preloader-lime)" />
            </g>
          </g>
        </svg>
      </div>
      <div class="dth-preloader-title">
        <span>DOMAIN</span> <span class="teal">TECH</span> <span class="lime">HUB</span>
      </div>
      <div class="dth-preloader-sub">Nairobi Studio · Web &amp; Software Systems</div>
      <div class="dth-preloader-track">
        <div class="dth-preloader-bar"></div>
      </div>
    </div>

    <!-- React Root Mount Point -->
    <div id="root"></div>

    <!-- Safety Fallback: Automatically dismiss preloader once window loads if not already dismissed by React -->
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var p = document.getElementById('dth-preloader');
          if (p && !p.classList.contains('dth-preloader-hidden')) {
            p.classList.add('dth-preloader-hidden');
            setTimeout(function() { if (p && p.parentNode) p.parentNode.removeChild(p); }, 600);
          }
        }, 900);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
